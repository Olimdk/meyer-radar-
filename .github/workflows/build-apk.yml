name: Build Meyer Radar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare project source
        shell: bash
        run: |
          set -e
          if [ -f "meyer-radar-android.zip" ]; then
            unzip -o meyer-radar-android.zip
            PROJECT_DIR="meyer-radar-android"
          elif [ -d "meyer-radar-android" ]; then
            PROJECT_DIR="meyer-radar-android"
          elif [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            echo "Could not find project source."
            echo "Upload meyer-radar-android.zip at the repository root."
            exit 1
          fi
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER=""
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1 || true)
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found after Android SDK setup"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          echo y | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Verify build tools
        shell: bash
        run: |
          set -e
          command -v java
          command -v gradle
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meyer-radar-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
