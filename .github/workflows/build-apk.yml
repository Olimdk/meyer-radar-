name: Build Meyer Radar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare project source
        shell: bash
        run: |
          set -e
          if [ -f "meyer-radar-android.zip" ]; then
            unzip -o meyer-radar-android.zip
            PROJECT_DIR="meyer-radar-android"
          elif [ -d "meyer-radar-android" ]; then
            PROJECT_DIR="meyer-radar-android"
          elif [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            echo "Could not find project source."
            echo "Upload meyer-radar-android.zip at the repository root."
            exit 1
          fi
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e
          curl --fail --silent --show-error --location             --output /tmp/gradle-8.9-bin.zip             https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK command-line tools
        shell: bash
        run: |
          set -e
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools" /tmp/android-tools
          curl --fail --silent --show-error --location             --output /tmp/android-tools/commandlinetools.zip             https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/android-tools/commandlinetools.zip -d /tmp/android-tools
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv /tmp/android-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Accept licenses and install SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          echo y | "$SDKMANAGER" --sdk_root="$ANDROID_HOME"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0" > /dev/null

      - name: Verify build tools
        shell: bash
        run: |
          set -e
          java -version
          gradle --version
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          printf 'sdk.dir=%s
' "$ANDROID_HOME" > local.properties
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meyer-radar-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
